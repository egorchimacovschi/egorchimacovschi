name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Header
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: header.svg
          config_timezone: Europe/Bucharest
          base: header
      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: repositories.svg
          config_timezone: Europe/Bucharest
          base: repositories
      - name: Activity and community
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: acti_comm.svg
          config_timezone: Europe/Bucharest
          base: activity, community
      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: iso_calendar.svg
          config_timezone: Europe/Bucharest
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: indepth.svg
          config_timezone: Europe/Bucharest
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
      - name: Lines of code
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: lines-of-code.svg
          config_timezone: Europe/Bucharest
          base: ""
          plugin_lines: yes
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: github-habits.svg
          config_timezone: Europe/Bucharest
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: achievements.svg
          config_timezone: Europe/Bucharest
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
      - name: Topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: egorchimacovschi
          filename: topics_icons.svg
          config_timezone: Europe/Bucharest
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons